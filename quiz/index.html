<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Investing Profile Quiz</title>

<meta property="og:type" content="website">
<meta property="og:title" content="What's Your Investing Personality?">
<meta property="og:description" content="8 archetypes. 20 questions. 2 minutes. Take the free quiz to find out.">
<meta property="og:image" content="https://learntolovemoney.com/quiz/og-image-v2.png">
<meta property="og:image:width" content="1200">
<meta property="og:image:height" content="630">
<meta property="og:url" content="https://learntolovemoney.com/quiz/">
<meta name="twitter:card" content="summary_large_image">
<meta name="twitter:title" content="What's Your Investing Personality?">
<meta name="twitter:description" content="8 archetypes. 20 questions. 2 minutes. Take the free quiz to find out.">
<meta name="twitter:image" content="https://learntolovemoney.com/quiz/og-image-v2.png">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Gelasio:ital,wght@0,400;0,500;0,600;0,700;1,400;1,600&display=swap" rel="stylesheet">
<style>
  :root {
    /* LTLM brand palette */
    --bg-base: #0C1F16;
    --bg-mid: #0A1A13;
    --bg-deep: #060F0B;

    --card-top: #14291D;
    --card-bottom: #0E2016;
    --card-border: rgba(184, 145, 47, 0.22);
    --card-border-hover: rgba(217, 177, 90, 0.55);

    --gold: #B8912F;
    --gold-bright: #D9B15A;
    --mint: #7FD9A8;
    --blue: #5FA8D3;
    --rust: #D9695A;

    --cream: #F5F1E6;
    --body-copy: #C7D0C9;
    --muted-label: #8FA096;
    --footnote: #6E7D74;

    --font-heading: 'Gelasio', Georgia, serif;
    --font-body: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Liberation Sans', sans-serif;
  }

  * { box-sizing: border-box; }

  html {
    background: var(--bg-deep);
  }

  body {
    margin: 0;
    min-height: 100vh;
    background:
      radial-gradient(ellipse 900px 500px at 50% -10%, var(--bg-mid) 0%, transparent 60%),
      linear-gradient(180deg, var(--bg-base) 0%, var(--bg-mid) 45%, var(--bg-deep) 100%);
    background-attachment: fixed;
    color: var(--body-copy);
    font-family: var(--font-body);
    display: flex;
    align-items: flex-start;
    justify-content: center;
    padding: 24px 16px;
  }

  @media (max-width: 480px) {
    body {
      padding: 16px 12px;
    }
  }

  :focus {
    outline: none;
  }

  :focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 2px;
  }

  h1, h2, h3 {
    font-family: var(--font-heading);
    color: var(--cream);
  }

  .quiz-container, .results-container {
    width: 100%;
    max-width: 560px;
  }

  .hidden {
    display: none !important;
  }

  /* ---------- Home screen ---------- */

  .home-container {
    width: 100%;
    max-width: 560px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
    padding-top: 12vh;
  }

  .home-title {
    font-family: var(--font-heading);
    font-weight: 600;
    color: var(--cream);
    font-size: clamp(30px, 6.5vw, 46px);
    line-height: 1.18;
    margin: 0 0 18px 0;
  }

  .home-subtitle {
    font-size: 16px;
    line-height: 1.6;
    color: var(--body-copy);
    max-width: 440px;
    margin: 0 0 36px 0;
  }

  .take-quiz-btn {
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 19px;
    color: var(--bg-deep);
    background: linear-gradient(135deg, var(--gold-bright), var(--gold) 100%);
    border: none;
    border-radius: 999px;
    padding: 20px 48px;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(184, 145, 47, 0.3), 0 4px 14px rgba(0, 0, 0, 0.35);
    transition: box-shadow 0.15s ease, filter 0.15s ease;
  }

  @media (prefers-reduced-motion: no-preference) {
    .take-quiz-btn {
      transition: transform 0.15s ease, box-shadow 0.15s ease, filter 0.15s ease;
    }

    .take-quiz-btn:hover {
      transform: translateY(-2px) scale(1.02);
    }

    .take-quiz-btn:active {
      transform: translateY(0) scale(0.99);
    }
  }

  .take-quiz-btn:hover {
    filter: brightness(1.06);
    box-shadow: 0 14px 36px rgba(184, 145, 47, 0.4), 0 6px 18px rgba(0, 0, 0, 0.4);
  }

  .home-meta {
    margin-top: 20px;
    font-size: 13px;
    letter-spacing: 0.03em;
    color: var(--muted-label);
  }

  /* ---------- Quiz screens ---------- */

  .progress-track {
    width: 100%;
    height: 8px;
    background: var(--card-bottom);
    border: 1px solid var(--card-border);
    border-radius: 999px;
    overflow: hidden;
    margin-bottom: 12px;
  }

  .progress-fill {
    height: 100%;
    background: linear-gradient(90deg, var(--gold), var(--gold-bright));
    border-radius: 999px;
    transition: width 0.3s ease;
    width: 5%;
  }

  .progress-label {
    font-size: 13px;
    color: var(--muted-label);
    margin-bottom: 32px;
    text-align: right;
  }

  .question-text {
    font-family: var(--font-heading);
    font-weight: 600;
    color: var(--cream);
    font-size: clamp(20px, 4vw, 26px);
    line-height: 1.4;
    margin: 0 0 28px 0;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 32px;
  }

  button {
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .option {
    background: linear-gradient(160deg, var(--card-top), var(--card-bottom));
    border: 1.5px solid var(--card-border);
    border-radius: 12px;
    padding: 16px 18px;
    font-family: var(--font-body);
    font-size: 15px;
    line-height: 1.5;
    color: var(--body-copy);
    text-align: left;
    cursor: pointer;
    user-select: none;
    -webkit-user-select: none;
    transition: border-color 0.15s ease, background 0.15s ease;
  }

  @media (prefers-reduced-motion: no-preference) {
    .option {
      transition: border-color 0.15s ease, background 0.15s ease, transform 0.15s ease;
    }

    .option:hover, .option:active {
      transform: scale(1.01);
    }
  }

  .option:hover {
    border-color: var(--card-border-hover);
  }

  .option.selected {
    border-color: var(--mint);
    background: linear-gradient(160deg, rgba(127, 217, 168, 0.14), var(--card-bottom));
    color: var(--cream);
  }

  .option:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 2px;
    border-color: var(--gold-bright);
  }

  .nav-row {
    display: flex;
    justify-content: flex-end;
  }

  .next-btn {
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 15px;
    color: var(--bg-deep);
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    border: none;
    border-radius: 10px;
    padding: 14px 32px;
    cursor: pointer;
    transition: filter 0.15s ease, opacity 0.15s ease;
  }

  .next-btn:hover:not(:disabled) {
    filter: brightness(1.08);
  }

  .next-btn:disabled {
    opacity: 0.35;
    cursor: not-allowed;
  }

  .retake-btn {
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 15px;
    color: var(--gold-bright);
    background: transparent;
    border: 1.5px solid var(--gold);
    border-radius: 10px;
    padding: 13px 30px;
    cursor: pointer;
    transition: border-color 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  .retake-btn:hover {
    border-color: var(--gold-bright);
    background: rgba(184, 145, 47, 0.1);
  }

  /* ---------- Results screen ---------- */

  .results-eyebrow {
    font-size: 13px;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--gold-bright);
    font-weight: 600;
    margin: 0 0 8px 0;
  }

  .archetype-name {
    font-family: var(--font-heading);
    font-weight: 600;
    color: var(--cream);
    font-size: clamp(28px, 6vw, 38px);
    line-height: 1.2;
    margin: 0 0 16px 0;
  }

  .archetype-description {
    font-size: 16px;
    line-height: 1.6;
    color: var(--body-copy);
    margin: 0 0 32px 0;
  }

  .teaser {
    font-size: 17px;
    line-height: 1.55;
    color: var(--body-copy);
    margin: 0 0 28px 0;
  }

  /* ---------- Email gate ---------- */

  .locked-section {
    position: relative;
    padding-top: 24px;
    margin-top: 24px;
    border-top: 1px solid var(--card-border);
  }

  .locked-section.locked {
    max-height: 190px;
    overflow: hidden;
    filter: blur(4px);
    user-select: none;
    pointer-events: none;
    transition: filter 0.5s ease;
  }

  .gate-fade {
    display: none;
  }

  .locked-section.locked .gate-fade {
    display: block;
    position: absolute;
    inset: 0;
    background: linear-gradient(to bottom, transparent 25%, var(--bg-base) 90%);
  }

  .email-gate {
    position: relative;
    z-index: 2;
    background: linear-gradient(160deg, var(--card-top), var(--card-bottom));
    border: 1px solid var(--card-border);
    border-radius: 16px;
    padding: 24px;
    margin-top: -36px;
    box-shadow: 0 12px 32px rgba(0, 0, 0, 0.4);
    transition: opacity 0.4s ease;
  }

  .email-gate.gate-hidden {
    opacity: 0;
  }

  .gate-eyebrow {
    font-family: var(--font-heading);
    font-weight: 600;
    color: var(--cream);
    font-size: 16px;
    margin: 0 0 8px 0;
  }

  .gate-copy {
    font-size: 14px;
    line-height: 1.55;
    color: var(--body-copy);
    margin: 0 0 18px 0;
  }

  .email-form {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .email-input {
    width: 100%;
    background: var(--bg-deep);
    border: 1.5px solid var(--card-border);
    border-radius: 10px;
    padding: 13px 16px;
    font-family: var(--font-body);
    font-size: 15px;
    color: var(--cream);
  }

  .email-input::placeholder {
    color: var(--footnote);
  }

  .email-input:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 2px;
    border-color: var(--gold-bright);
  }

  .email-input[aria-invalid="true"] {
    border-color: var(--rust);
  }

  .unlock-btn {
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 15px;
    color: var(--bg-deep);
    background: linear-gradient(135deg, var(--gold-bright), var(--gold));
    border: none;
    border-radius: 10px;
    padding: 14px 24px;
    cursor: pointer;
    transition: filter 0.15s ease, opacity 0.15s ease;
  }

  .unlock-btn:hover:not(:disabled) {
    filter: brightness(1.08);
  }

  .unlock-btn:disabled {
    opacity: 0.6;
    cursor: default;
  }

  .email-error {
    font-size: 13px;
    color: var(--rust);
    margin: 4px 0 0 0;
  }

  .email-microcopy {
    font-size: 12px;
    line-height: 1.5;
    color: var(--footnote);
    margin: 12px 0 0 0;
  }

  .full-results {
    opacity: 0;
    transition: opacity 0.6s ease;
  }

  .full-results.revealed {
    opacity: 1;
  }

  .tier-badge {
    display: inline-block;
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 12px;
    letter-spacing: 0.05em;
    text-transform: uppercase;
    padding: 6px 14px;
    border-radius: 999px;
    margin-bottom: 24px;
  }

  .tier-badge.confirmed {
    background: rgba(127, 217, 168, 0.16);
    color: var(--mint);
  }

  .tier-badge.caveat {
    background: rgba(184, 145, 47, 0.2);
    color: var(--gold-bright);
  }

  .tier-badge.rerouted {
    background: rgba(217, 105, 90, 0.18);
    color: var(--rust);
  }

  .results-section {
    border-top: 1px solid var(--card-border);
    padding-top: 24px;
    margin-top: 24px;
  }

  .results-section h2 {
    font-family: var(--font-heading);
    font-size: 18px;
    font-weight: 600;
    color: var(--cream);
    margin: 0 0 14px 0;
  }

  .results-section p {
    font-size: 15px;
    line-height: 1.65;
    color: var(--body-copy);
    margin: 0 0 12px 0;
  }

  .reason-list {
    margin: 0 0 4px 0;
    padding-left: 20px;
  }

  .reason-list li {
    font-size: 15px;
    line-height: 1.6;
    margin-bottom: 10px;
    color: var(--body-copy);
  }

  .dimension-table {
    width: 100%;
    border-collapse: collapse;
    margin-bottom: 20px;
    font-size: 14px;
  }

  .dimension-table th, .dimension-table td {
    text-align: left;
    padding: 10px 8px;
    border-bottom: 1px solid var(--card-border);
  }

  .dimension-table th {
    color: var(--muted-label);
    font-weight: 500;
    font-size: 12px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .dimension-table td.num {
    font-family: var(--font-heading);
    font-weight: 600;
    color: var(--blue);
  }

  .dimension-table th:last-child, .dimension-table td:last-child {
    color: var(--gold-bright);
  }

  .dimension-table td.num:last-of-type {
    color: var(--gold-bright);
  }

  .tier-note {
    background: linear-gradient(160deg, var(--card-top), var(--card-bottom));
    border: 1px solid var(--card-border);
    border-radius: 12px;
    padding: 16px 18px;
    font-size: 15px;
    line-height: 1.6;
    color: var(--body-copy);
  }

  .tier-note strong {
    color: var(--gold-bright);
  }

  .retake-row {
    margin-top: 36px;
    display: flex;
    justify-content: center;
  }

  /* ---------- QA scoring breakdown ---------- */

  .qa-toggle {
    margin-top: 8px;
  }

  .qa-toggle summary {
    cursor: pointer;
    font-family: var(--font-heading);
    font-weight: 600;
    font-size: 14px;
    color: var(--gold-bright);
    padding: 8px 0;
    list-style: none;
  }

  .qa-toggle summary::-webkit-details-marker {
    display: none;
  }

  .qa-toggle summary::before {
    content: '▸';
    display: inline-block;
    margin-right: 8px;
    transition: transform 0.15s ease;
  }

  .qa-toggle[open] summary::before {
    transform: rotate(90deg);
  }

  .qa-toggle summary:focus-visible {
    outline: 2px solid var(--gold-bright);
    outline-offset: 4px;
  }

  .table-wrap {
    overflow-x: auto;
    -webkit-overflow-scrolling: touch;
  }

  .qa-table {
    width: 100%;
    table-layout: fixed;
    border-collapse: collapse;
    margin-top: 12px;
    font-size: 13px;
  }

  .qa-table th:last-child, .qa-table td:last-child {
    width: 84px;
  }

  .qa-table th, .qa-table td {
    text-align: left;
    padding: 9px 8px;
    border-bottom: 1px solid var(--card-border);
    white-space: normal;
    word-break: break-word;
    vertical-align: middle;
  }

  .qa-table th {
    color: var(--muted-label);
    font-weight: 500;
    font-size: 11px;
    text-transform: uppercase;
    letter-spacing: 0.04em;
  }

  .qa-table td.num {
    font-family: var(--font-heading);
    font-weight: 600;
    color: var(--blue);
    white-space: nowrap;
  }

  .qa-table tr.is-winner {
    background: rgba(184, 145, 47, 0.08);
  }

  .qa-tag {
    display: inline-block;
    font-size: 10px;
    font-weight: 600;
    letter-spacing: 0.03em;
    text-transform: uppercase;
    padding: 3px 7px;
    border-radius: 6px;
    margin: 3px 6px 0 0;
  }

  .qa-tag.stage1 {
    background: rgba(143, 160, 150, 0.16);
    color: var(--muted-label);
  }

  .qa-tag.final {
    background: rgba(184, 145, 47, 0.25);
    color: var(--gold-bright);
  }

  /* ---------- Disclaimer ---------- */

  .disclaimer {
    margin-top: 32px;
    padding-top: 20px;
    border-top: 1px solid var(--card-border);
    font-size: 12.5px;
    line-height: 1.6;
    color: var(--footnote);
  }

  .disclaimer strong {
    color: var(--muted-label);
  }

  /* ---------- Mobile-friendly tweaks ---------- */

  @media (max-width: 480px) {
    .home-container {
      padding-top: 8vh;
    }

    .take-quiz-btn {
      width: 100%;
      padding: 18px 24px;
      font-size: 17px;
    }

    .question-text {
      margin-bottom: 22px;
    }

    .option {
      padding: 14px 16px;
      font-size: 14px;
    }

    .next-btn, .retake-btn {
      width: 100%;
      padding: 14px 24px;
    }

    .nav-row {
      justify-content: stretch;
    }

    .archetype-name {
      font-size: 26px;
    }

    .results-section {
      padding-top: 20px;
      margin-top: 20px;
    }

    .dimension-table, .qa-table {
      font-size: 13px;
    }
  }
</style>
</head>
<body>

<div class="home-container" id="homeContainer">
  <p class="results-eyebrow">Investor Type Quiz</p>
  <h1 class="home-title">What's Your Investing Personality?</h1>
  <p class="home-subtitle">Answer 20 quick questions about how you think, feel, and act with money to find out which of 8 investor archetypes fits you best.</p>
  <button class="take-quiz-btn" id="takeQuizBtn">Take the Quiz</button>
  <p class="home-meta">8 archetypes · 20 questions · 2 minutes</p>
</div>

<div class="quiz-container hidden" id="quizContainer">
  <div class="progress-track">
    <div class="progress-fill" id="progressFill"></div>
  </div>
  <div class="progress-label" id="progressLabel">Question 1 of 20</div>

  <h1 class="question-text" id="questionText"></h1>

  <div class="options" id="optionsContainer"></div>

  <div class="nav-row">
    <button class="next-btn" id="nextBtn" disabled>Next</button>
  </div>
</div>

<div class="results-container hidden" id="resultsContainer"></div>

<script>
  const questions = [
    {
      text: "What appeals to you most when evaluating a potential investment?",
      options: [
        { label: "A high-quality, well-run business trading at a fair price that I could hold for decades", scores: { BuffettCompounder: 2 }, reason: "You gravitate toward high-quality, understandable businesses you can hold for decades rather than chasing what's exciting right now." },
        { label: "A company disrupting its industry with a long runway for growth, even if it's not \"cheap\"", scores: { GrowthChaser: 2 }, reason: "You're drawn to disruptive companies with long growth runways, even when the price isn't obviously cheap." },
        { label: "A company that pays me steady cash regardless of what the stock price does", scores: { IncomeBuilder: 2 }, reason: "You prioritize investments that pay you steady cash over ones that simply grow in value." },
        { label: "I'd rather not evaluate individual companies at all", scores: { PassiveOptimizer: 2 }, reason: "You'd rather not pick individual companies at all — broad, hands-off exposure suits you better." },
        { label: "A reasonably priced company with above-average growth prospects — not the cheapest, not the flashiest", scores: { GARPHybrid: 2 }, reason: "You look for a middle ground — real growth potential at a price that's still reasonable, not the cheapest or the flashiest option." }
      ]
    },
    {
      text: "A stock has crashed 50% and is deeply out of favor with the market. Your reaction?",
      options: [
        { label: "That's exactly where I look — undervalued, unloved, and potentially mispriced", scores: { ContrarianDeepValue: 2 }, reason: "When a stock craters and falls out of favor, you see a mispriced opportunity rather than a warning sign." },
        { label: "Could be interesting, but only if fundamentals still support solid growth", scores: { GARPHybrid: 1 }, reason: "You're open to buying into weakness, but only when the underlying growth fundamentals still hold up." },
        { label: "I'd want to see signs of stabilization or an upward trend before touching it", scores: { MomentumTrader: 2 }, reason: "You wait for a stock to show signs of stabilizing or trending back up before getting involved." },
        { label: "Not my style — I prefer proven, stable businesses, not turnarounds", scores: { BuffettCompounder: 1 }, reason: "You prefer proven, stable businesses over trying to time a turnaround." },
        { label: "I'd rather stay diversified than pick through the wreckage myself", scores: { PassiveOptimizer: 2 }, reason: "You'd rather stay diversified than sift through distressed situations yourself." }
      ]
    },
    {
      text: "A stock is surging on strong momentum and heavy media attention. Your instinct?",
      options: [
        { label: "That's a signal worth acting on — trends tend to continue", scores: { MomentumTrader: 2 }, reason: "You treat strong price momentum and heavy attention as a signal worth acting on." },
        { label: "I'd check if the fundamentals justify the price before jumping in", scores: { GARPHybrid: 1 }, reason: "Even when a stock is hot, you check whether the fundamentals actually justify the price before buying." },
        { label: "Hype makes me cautious — I'd rather wait or avoid it entirely", scores: { BuffettCompounder: 1 }, reason: "Hype makes you cautious, and you'd rather wait out the excitement or avoid it altogether." },
        { label: "I'd rather own it as a small speculative position, not a core holding", scores: { BarbellAllocator: 2 }, reason: "You're willing to take a small speculative swing on a trending stock, but only as a side bet, not a core holding." },
        { label: "Doesn't matter to me — I don't react to individual stock news", scores: { PassiveOptimizer: 1 }, reason: "Stock-specific news and hype don't really factor into how you invest." }
      ]
    },
    {
      text: "How do you feel about paying a premium price for a fast-growing company?",
      options: [
        { label: "Worth it if the growth story is real and the runway is long", scores: { GrowthChaser: 2 }, reason: "You're willing to pay a premium for a fast grower as long as the growth story and runway are real." },
        { label: "Only within reason — I want growth and a defensible price", scores: { GARPHybrid: 2 }, reason: "You want growth, but only within reason — a defensible price still matters to you." },
        { label: "I'd rather pay fair value for a proven business than a premium for a promise", scores: { BuffettCompounder: 1 }, reason: "You'd rather pay fair value for a proven business than a premium for a promise." },
        { label: "I'd rather not — overpaying for anything makes me uncomfortable", scores: { ContrarianDeepValue: 1 }, reason: "Overpaying for anything makes you uncomfortable, growth story or not." },

  function getRankedArchetypes() {
    return Object.entries(archetypeScores)
      .sort((a, b) => b[1] - a[1])
      .map(([archetype, score]) => ({ archetype, score }));
  }

  function resolveStage1Result() {
    const ranked = getRankedArchetypes();
    const top = ranked[0];
    const second = ranked[1];

    if (Math.abs(top.score - second.score) <= 1) {
      stage1Tie = true;
      tieCandidates = [top.archetype, second.archetype];
      winningArchetype = null; // decided after Stage 2 mismatch comparison
    } else {
      stage1Tie = false;
      tieCandidates = null;
      winningArchetype = top.archetype;
    }
  }

  function calcMismatch(dimAvg, ideal) {
    return (
      2 * Math.abs(dimAvg.Risk - ideal.Risk) +
      1 * Math.abs(dimAvg.Horizon - ideal.Horizon) +
      2 * Math.abs(dimAvg.Involvement - ideal.Involvement)
    );
  }

  function getDimensionContributions(dimAvg, ideal) {
    return [
      { dimension: 'Risk', gap: 2 * Math.abs(dimAvg.Risk - ideal.Risk) },
      { dimension: 'Horizon', gap: 1 * Math.abs(dimAvg.Horizon - ideal.Horizon) },
      { dimension: 'Involvement', gap: 2 * Math.abs(dimAvg.Involvement - ideal.Involvement) }
    ].sort((a, b) => b.gap - a.gap);
  }

  function renderQuestion() {
    selectedOptionIndex = null;
    nextBtn.disabled = true;

    const q = stage === 1 ? questions[currentQuestion] : stage2Questions[currentQuestion];
    questionText.textContent = q.text;

    const questionsAnswered = stage === 1 ? currentQuestion : questions.length + currentQuestion;
    progressFill.style.width = `${((questionsAnswered + 1) / totalQuestions) * 100}%`;
    progressLabel.textContent = `Question ${questionsAnswered + 1} of ${totalQuestions}`;

    optionsContainer.innerHTML = '';
    q.options.forEach((option, index) => {
      const btn = document.createElement('button');
      btn.className = 'option';
      btn.textContent = option.label;
      btn.addEventListener('click', () => selectOption(index));
      optionsContainer.appendChild(btn);
    });

    const isFinalQuestion = stage === 2 && currentQuestion === stage2Questions.length - 1;
    nextBtn.textContent = isFinalQuestion ? 'Finish' : 'Next';
  }

    selectedOptionIndex = index;
    nextBtn.disabled = false;

    });

  function applyStage1Scores() {
    const chosen = questions[currentQuestion].options[selectedOptionIndex];
    for (const archetype in chosen.scores) {
      archetypeScores[archetype] += chosen.scores[archetype];
    }
    stage1AnswerLog.push({ scores: chosen.scores, reason: chosen.reason });
  }

  function applyStage2Scores() {
    const q = stage2Questions[currentQuestion];
    const chosen = q.options[selectedOptionIndex];
    dimensionAnswers[q.dimension].push(chosen.points);
  }

  function average(arr) {
    return arr.reduce((sum, n) => sum + n, 0) / arr.length;
  }

  function finishQuiz() {
    dimensionAverages.Risk = average(dimensionAnswers.Risk);
    dimensionAverages.Horizon = average(dimensionAnswers.Horizon);
    dimensionAverages.Involvement = average(dimensionAnswers.Involvement);

    if (stage1Tie) {
      // Calculate mismatch against BOTH tied candidates; lower mismatch wins the tie.
      const [candidateA, candidateB] = tieCandidates;
      const mismatchA = calcMismatch(dimensionAverages, archetypeIdealProfiles[candidateA]);
      const mismatchB = calcMismatch(dimensionAverages, archetypeIdealProfiles[candidateB]);

      winningArchetype = mismatchA <= mismatchB ? candidateA : candidateB;
      mismatchScore = Math.min(mismatchA, mismatchB);
    } else {
      mismatchScore = calcMismatch(dimensionAverages, archetypeIdealProfiles[winningArchetype]);
    }

    originalArchetype = winningArchetype;
    dimensionContributions = getDimensionContributions(dimensionAverages, archetypeIdealProfiles[winningArchetype]);

    // Mismatch score for ALL 8 archetypes — used for the reroute search and the QA breakdown table.

      .map(archetype => ({
        archetype,
        mismatch: calcMismatch(dimensionAverages, archetypeIdealProfiles[archetype])
      }))
      .sort((a, b) => a.mismatch - b.mismatch);

    // Override/reroute tiers
    if (mismatchScore <= 4) {
      finalTier = 'confirmed';
      finalArchetype = winningArchetype;
    } else if (mismatchScore <= 9) {
      finalTier = 'caveat';
      finalArchetype = winningArchetype;
    } else {
      finalTier = 'rerouted';
      finalArchetype = allArchetypeMismatches[0].archetype;
    }

    renderResults();
  }

  function dimensionSentence(dimension, userVal, idealVal) {
    const diff = userVal - idealVal;

    if (dimension === 'Involvement') {
      return diff < 0
        ? "This archetype typically involves active company research, but your involvement score came in low — consider a fund or ETF built around this style rather than picking individual stocks yourself."

    }

    if (dimension === 'Risk') {
      return diff < 0
        ? "Your comfort with volatility came in lower than this style usually requires, which can make it hard to stick with during a rough stretch."
        : "You're more comfortable with volatility than this style typically involves — you may find it doesn't fully use your risk appetite.";
    }

    // Horizon
    return diff < 0
      ? "Your time horizon is shorter than what this approach typically assumes, which may not give the strategy enough runway to fully play out."
      : "Your time horizon is longer than this approach typically requires, giving you more flexibility than the archetype assumes.";
  }

      </table>

    const finalName = archetypeDisplayNames[finalArchetype];

    if (finalTier === 'confirmed') {
      return `<div class="tier-note">Your risk tolerance, time horizon, and involvement level line up well with the <strong>${finalName}</strong> approach — the way you think about investing matches how you're actually likely to behave with your money.</div>`;
    }

    if (finalTier === 'caveat') {
      const topDims = dimensionContributions.filter(d => d.gap > 0).slice(0, 2);
      const sentences = topDims
        .map(d => dimensionSentence(d.dimension, dimensionAverages[d.dimension], archetypeIdealProfiles[finalArchetype][d.dimension]))
        .filter(Boolean);
      return `<div class="tier-note">The <strong>${finalName}</strong> label still fits your investing philosophy best, but there's a gap worth knowing about. ${sentences.join(' ')}</div>`;
    }

    // rerouted
    const topDims = dimensionContributions.filter(d => d.gap > 0).slice(0, 2);
    const dimNames = topDims.map(d => d.dimension).join(' and ');
    const sentences = topDims
      .map(d => dimensionSentence(d.dimension, dimensionAverages[d.dimension], archetypeIdealProfiles[originalArchetype][d.dimension]))
      .filter(Boolean);
    return `<div class="tier-note">Your Stage 1 answers pointed toward the <strong>${originalName}</strong> philosophy, but your ${dimNames} didn't support that approach in practice. Based on how you actually behave with money, you've been matched instead with <strong>${finalName}</strong>. ${sentences.join(' ')}</div>`;

          </div>
        </div>
      </details>
    `;
  }

  function isValidEmail(email) {
    return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email);
  }

  function unlockResults() {
    emailUnlocked = true;

    const whyWrap = document.getElementById('whyLandedHere');
    const gate = document.getElementById('emailGate');
    const full = document.getElementById('fullResults');

    whyWrap.classList.remove('locked');
    gate.classList.add('gate-hidden');
    full.classList.remove('hidden');
    requestAnimationFrame(() => full.classList.add('revealed'));

    setTimeout(() => { gate.style.display = 'none'; }, 400);
  }

  function handleEmailSubmit(event) {
    event.preventDefault();

    const emailInput = document.getElementById('emailInput');
    const emailError = document.getElementById('emailError');
    const unlockBtn = document.getElementById('unlockBtn');
    const email = emailInput.value.trim();

    if (!isValidEmail(email)) {
      emailError.classList.remove('hidden');
      emailInput.setAttribute('aria-invalid', 'true');
      return;
    }

    emailError.classList.add('hidden');
    emailInput.removeAttribute('aria-invalid');
    unlockBtn.disabled = true;
    unlockBtn.textContent = 'Unlocking...';

    // Apps Script webhooks don't return CORS headers, so the response is opaque under
    // mode: 'no-cors'. We can't read success/failure from it — reveal results optimistically
    // once the request has been sent, in both the resolve and reject paths.
    fetch(EMAIL_WEBHOOK_URL, {
      method: 'POST',
      mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain' },
      body: JSON.stringify({ email, archetype: archetypeDisplayNames[finalArchetype] })
    })
      .then(unlockResults)
      .catch(unlockResults);
  }

  function renderResults() {
    const finalName = archetypeDisplayNames[finalArchetype];
    const reasons = getTopReasons(originalArchetype, 3);
    const tableIdeal = archetypeIdealProfiles[finalArchetype];

    resultsContainer.innerHTML = `
      <p class="results-eyebrow">Your Profile</p>
      <h1 class="archetype-name">${finalName}</h1>
      <p class="teaser">${archetypeTeasers[finalArchetype]}</p>

      <div class="locked-section locked" id="whyLandedHere">
        <h2>Why You Landed Here</h2>
        <ul class="reason-list">
          ${reasons.map(r => `<li>${r}</li>`).join('')}
        </ul>
        <div class="gate-fade"></div>
      </div>

      <div class="email-gate" id="emailGate">
        <p class="gate-eyebrow">🔒 Unlock Your Full Results</p>
        <p class="gate-copy">Enter your email to see exactly why you landed here, how your risk tolerance, time horizon, and involvement level compare to this archetype, and the full scoring breakdown.</p>
        <form class="email-form" id="emailForm" novalidate>
          <input type="email" class="email-input" id="emailInput" placeholder="you@example.com" autocomplete="email" required>
          <button type="submit" class="unlock-btn" id="unlockBtn">Unlock My Full Results</button>
        </form>
        <p class="email-error hidden" id="emailError">Please enter a valid email address.</p>
        <p class="email-microcopy">We'll only use this to send your results and occasional investing insights — no spam.</p>
      </div>

      <div class="full-results hidden" id="fullResults">
        <div class="results-section" style="border-top: none; padding-top: 0;">
          <span class="tier-badge ${finalTier}">${finalTier}</span>
          <p class="archetype-description">${archetypeDescriptions[finalArchetype]}</p>
        </div>

        <div class="results-section">
          <h2>How Your Risk Tolerance, Time Horizon, and Involvement Shape This</h2>
          ${buildDimensionTable(tableIdeal)}
          ${buildTierNote()}
        </div>

        <div class="results-section">
          ${buildQASection()}
        </div>

        <p class="disclaimer"><strong>Disclaimer:</strong> This quiz is for entertainment and self-reflection purposes only. It is not investment, financial, tax, or legal advice, and it does not constitute a recommendation to buy, sell, or hold any security or to adopt any particular investment strategy. The archetypes, scoring, and commentary are simplified generalizations and do not account for your complete financial situation, goals, or risk capacity. Nothing here should be relied upon when making investment decisions — consult a licensed financial advisor before making any investment or financial planning decisions.</p>
      </div>

      <div class="retake-row">
        <button class="retake-btn" id="retakeBtn">Retake Quiz</button>
      </div>
    `;

    quizContainer.classList.add('hidden');
    resultsContainer.classList.remove('hidden');

    document.getElementById('emailForm').addEventListener('submit', handleEmailSubmit);
    document.getElementById('retakeBtn').addEventListener('click', retakeQuiz);
  }

  function retakeQuiz() {
    currentQuestion = 0;
    stage = 1;
    selectedOptionIndex = null;
    winningArchetype = null;
    stage1Tie = false;
    tieCandidates = null;
    finalTier = null;
    finalArchetype = null;
    originalArchetype = null;
    dimensionContributions = null;
    dimensionAnswers = { Risk: [], Horizon: [], Involvement: [] };
    dimensionAverages = { Risk: 0, Horizon: 0, Involvement: 0 };
    mismatchScore = null;
    stage1AnswerLog = [];
    allArchetypeMismatches = [];
    emailUnlocked = false;
    for (const archetype in archetypeScores) archetypeScores[archetype] = 0;

    resultsContainer.classList.add('hidden');
    resultsContainer.innerHTML = '';
    quizContainer.classList.remove('hidden');

    renderQuestion();
  }

  nextBtn.addEventListener('click', () => {
    if (nextBtn.disabled || selectedOptionIndex === null) return;

    if (stage === 1) {
      applyStage1Scores();

      if (currentQuestion === questions.length - 1) {
        resolveStage1Result();
        stage = 2;
        currentQuestion = 0;
        renderQuestion();
        return;
      }

      currentQuestion++;
      renderQuestion();
      return;
    }

    // stage 2
    applyStage2Scores();

    if (currentQuestion === stage2Questions.length - 1) {
      finishQuiz();
      return;
    }

    currentQuestion++;
    renderQuestion();
  });

  takeQuizBtn.addEventListener('click', () => {
    homeContainer.classList.add('hidden');
    quizContainer.classList.remove('hidden');
    renderQuestion();
  });
</script>

</body>
</html>
